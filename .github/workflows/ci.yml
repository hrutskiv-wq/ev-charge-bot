name: CI

# Ганяє pytest на кожен push і кожен PR, щоб регресії (як-от знак балансу
# чи авторизація OCPI/Monobank) ловились до мержу, а не на проді.
# Основна маса тестів мокає БД і зовнішні виклики (job `test`, без реального
# Postgres). Окремий job `live-db-tests` піднімає справжній Postgres 16 для
# інтеграційних тестів, які моки принципово не покривають
# (test_start_ocpp_transaction_live.py — регресія на writable-CTE
# StartTransaction; test_charging_reservations_live.py — claim_reservation_
# for_settlement() дійсно серіалізує паралельні виклики, Промпт 3c-ii;
# test_alembic_from_scratch_live.py — `alembic upgrade head` на ПОРОЖНІЙ базі
# дає робочу схему, регресія на міграцію 0009: до неї `users`/`stations`
# створював лише бутстрап, і ланцюг падав на 0012;
# test_schema_parity_live.py — схема Alembic проти схеми бутстрапу, базлайн
# відомих розходжень, падає на НОВОМУ) — див. PROJECT_CONTEXT.md.
#
# Job `secret-scan` — бар'єр проти секретів у комітах (scripts/check_secrets.py).
# ГОЛОВНИЙ бар'єр цього класу: локальний git-хук (scripts/pre-commit) можна не
# встановити або обійти `--no-verify`, цей job — ні. Падає, а не лише попереджає.
#
# База для диффу залежить від події (round 2 рев'ю — БЛОКЕР 2, було: на
# прямому push у main `origin/main` після фетчу дорівнює HEAD, диф порожній,
# job зелений, не переглянувши жодного рядка — саме той шлях, яким прийшов
# коміт 5566a42 31.07.2026):
#   - pull_request: диф проти origin/main (three-dot, як GitHub рахує диф PR);
#   - push: диф проти github.event.before (сам діапазон запушених комітів),
#     origin/main — лише фолбек для щойно створеної гілки (before = усі нулі).
#
# round 3 рев'ю (БЛОКЕР): "before" з force-push (штатна операція цього
# репозиторію — "кожен бандл змержено rebase'ом") стає недосяжним ні з
# одного ref. Раніше це давало ТИХИЙ fail-open: `git diff` на недосяжний ref
# падає (exit 128), а `check_secrets.py` ігнорував код повернення й
# трактував порожній stdout як "секретів нема". Тепер: (1) сам скрипт при
# збої git кидає GitDiffError і повертає exit 1, а не 0 (fail-closed на
# рівні коду); (2) ТУТ, у CI, — явна перевірка досяжності `git cat-file -e`
# ДО виклику скрипта, з відкатом на `origin/main` (сканує всю гілку —
# безпечний бік) і ВИДИМИМ `::warning::` у лозі job'а, коли відкат
# трапляється (мовчазний фолбек — той самий клас невидимості, що вже двічі
# спливав у звірці резервацій, docs/SESSION_STATE.md).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Перевірити додані рядки на секрети
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "$GH_EVENT_NAME" = "push" ] && [ -n "$GH_EVENT_BEFORE" ] && [ "$GH_EVENT_BEFORE" != "$ZERO_SHA" ]; then
            BASE_REF="$GH_EVENT_BEFORE"
          else
            BASE_REF="origin/main"
          fi
          if ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
            echo "::warning::База $BASE_REF недосяжна (ймовірно force-push переписав історію) — відкіт на origin/main"
            BASE_REF="origin/main"
          fi
          echo "Диф проти: $BASE_REF (подія: $GH_EVENT_NAME)"
          python scripts/check_secrets.py --base "$BASE_REF"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          OCPI_SECRET_TOKEN: ci-placeholder-token
          BOT_TOKEN: "123456:ci-placeholder-bot-token"
          GEMINI_API_KEY: ci-placeholder-gemini-key
        run: pytest -v

  live-db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ev_admin
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: ev_charge_base
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ev_admin -d ev_charge_base"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run real-Postgres integration tests
        env:
          DB_URL: postgresql://ev_admin:ci_test_password@localhost:5432/ev_charge_base
          OCPI_SECRET_TOKEN: ci-placeholder-token
          BOT_TOKEN: "123456:ci-placeholder-bot-token"
          GEMINI_API_KEY: ci-placeholder-gemini-key
        run: pytest test_start_ocpp_transaction_live.py test_charging_reservations_live.py test_alembic_from_scratch_live.py test_schema_parity_live.py -v
